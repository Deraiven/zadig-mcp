[project]
name = "zadig-mcp"
version = "0.1.0"
description = "Basic MCP server for Zadig OpenAPI"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.0.0",
]

[project.scripts]
zadig-mcp = "zadig_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
